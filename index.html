<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Flip the coin | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>


      body {
        height: 100vh;
        background-color: #404A65;
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
      }

      #game-elements {
        display: flex;
        flex-direction: column;
        justify-self: center;
        align-self: center;
        align-items: center;
        justify-items: center;
      }

      #coin-and-shadow-container {
        display: flex;
        flex-direction: column;
        justify-items: center;
        align-items: center;
      }

      #flip-the-coin-text {
        margin: 80px 0px 40px 0px;
        font-family: 'Trebuchet MS';
        font-size: 4rem;
        color: white;
        text-shadow: 
          0 4px 8px rgba(0,0,0,0.5),
          0 16px 40px rgba(0,0,0,0.4);
        text-align: center;

        }

      #press-text{ 
        margin: 5px 0px 50px 0px;
        font-family: 'Trebuchet MS';
        font-size: 1rem;
        color: white;
      }

      #tossed-text{
        font-family: 'Trebuchet MS';
        color: #ffffff;
      }

      #random-btn{ 
      margin: 30px ;
      background: #3471eb ;              /* dark bluish background */
      color: #ffffff;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;             /* rounded rectangle */
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      }

      .break-word{ 
        display: block
      }

    </style>
    <script id="q3k8lm">
      document.addEventListener("DOMContentLoaded", () => {
      const coinImg = document.getElementById("coin-img");
      const tossedText = document.getElementById("tossed-text");
      const button = document.getElementById("random-btn");
      button.addEventListener("click", () => {
      // 50/50 random
      const isHeads = Math.random() < 0.5;

      if (isHeads) {
        coinImg.src = "resources/heads.svg";
        tossedText.textContent = "Heads";
      } else {
        coinImg.src = "resources/tails.svg";
        tossedText.textContent = "Tails";
      }
      });
    });
</script>
  </head>
  <body>
    <!-- 

    Flip a Coin Game
    Press the coin or the button to flip the coin
    Head
    Tail
    Random

    -->
    <div id="game-elements">
      <div id="flip-the-coin-text">Flip the coin</div>
      <div id="press-text">Press the coin or the button to flip the coin</div>
      <div id="coin-and-shadow-container">
        <div id="coin"><img id="coin-img" src="resources/heads.svg"></div>
        <div id="coin-shadow"><img src="resources/shadow.svg"></img></div>
        <div id="tossed-text">Head</div>    
        <button id="random-btn">Random</button>
      </div>
    </div>

    <!--
    Game ends
    -->

    <div class="author-info">
      Coded by <a href="#">Your Name Here</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>
  </body>
</html>
